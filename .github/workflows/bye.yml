name: Welcome to workflow
on: 
  pull_request:
    types: [closed]
permissions: 
  pull-requests: write
jobs:
  welcome:
    name: Post closing comment
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR_URL" --body "This pull request has been closed!" 
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          PR_URL: ${{ github.event.pull_request.html_url }} 
